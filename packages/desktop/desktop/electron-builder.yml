appId: com.watchdesk.app
productName: WatchDesk
copyright: Copyright 2026

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - node_modules/@watchdesk/native/**/*.node

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: github
